[project]
name = "aml"
version="0.0.1"
readme="README.md"
requires-python = ">=3.13"

dependencies = [
    "catboost>=1.2,<2",
    "joblib>=1.5,<2",
    "jupyter>=1.1,<2",
    "lightgbm>=4,<5",
    "matplotlib>=3.10,<4",
    "numpy>=2.1,<3",
    "optuna>=4,<5",
    "pandas>=2.3,<3",
    "pyarrow>=21,<24",
    "scikit-learn>=1.7,<2",
    "seaborn>=0.13,<1",
    "torch>=2.8,<3",
    "xgboost>=3,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
aml-train = "aml.modeling.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
