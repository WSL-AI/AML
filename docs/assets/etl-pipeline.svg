<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Как работает AML ETL pipeline</title>
  <desc id="desc">CSV или Parquet проходит извлечение, валидацию, построение признаков и сохранение. Только после успешной записи обновляется активный запуск.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="400" rx="22" fill="#f8fafc"/>
  <g font-family="Arial, DejaVu Sans, sans-serif">
    <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">Из транзакций — в данные для модели</text>
    <text x="40" y="84" font-size="18" fill="#475569">Один источник · отдельный запуск · история только из прошлого</text>
    <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M226 205 H266"/><path d="M460 205 H500"/><path d="M694 205 H734"/><path d="M928 205 H968"/>
    </g>
    <g>
      <rect x="40" y="125" width="184" height="165" rx="16" fill="#e2e8f0"/>
      <text x="58" y="157" font-size="14" font-weight="700" fill="#475569">ИСТОЧНИК</text>
      <text x="58" y="194" font-size="23" font-weight="700" fill="#0f172a">CSV / Parquet</text>
      <text x="58" y="229" font-size="17" fill="#334155">IBM AML</text>
      <text x="58" y="255" font-size="17" fill="#334155">LI-Small</text>
      <rect x="274" y="125" width="184" height="165" rx="16" fill="#dbeafe"/>
      <text x="292" y="157" font-size="14" font-weight="700" fill="#1d4ed8">EXTRACT</text>
      <text x="292" y="194" font-size="23" font-weight="700" fill="#0f172a">Прочитать</text>
      <text x="292" y="229" font-size="17" fill="#334155">Строки и колонки</text>
      <text x="292" y="255" font-size="17" fill="#334155">SHA256 источника</text>
      <rect x="508" y="125" width="184" height="165" rx="16" fill="#e0e7ff"/>
      <text x="526" y="157" font-size="14" font-weight="700" fill="#4338ca">VALIDATE</text>
      <text x="526" y="194" font-size="23" font-weight="700" fill="#0f172a">Проверить</text>
      <text x="526" y="229" font-size="17" fill="#334155">Типы и значения</text>
      <text x="526" y="255" font-size="17" fill="#334155">Порядок времени</text>
      <rect x="742" y="125" width="184" height="165" rx="16" fill="#ccfbf1"/>
      <text x="760" y="157" font-size="14" font-weight="700" fill="#0f766e">TRANSFORM</text>
      <text x="760" y="194" font-size="23" font-weight="700" fill="#0f172a">Подготовить</text>
      <text x="760" y="229" font-size="17" fill="#334155">Признаки и история</text>
      <text x="760" y="255" font-size="17" fill="#334155">OTE · 4 периода</text>
      <rect x="976" y="125" width="184" height="165" rx="16" fill="#dcfce7"/>
      <text x="994" y="157" font-size="14" font-weight="700" fill="#15803d">LOAD</text>
      <text x="994" y="194" font-size="23" font-weight="700" fill="#0f172a">Сохранить</text>
      <text x="994" y="229" font-size="17" fill="#334155">Parquet и JSON</text>
      <text x="994" y="255" font-size="17" fill="#334155">Отдельный run</text>
    </g>
    <rect x="40" y="318" width="1120" height="54" rx="12" fill="#0f172a"/>
    <text x="65" y="352" font-size="18" fill="#f8fafc">Все файлы записаны и проверены → SUCCESS → новый active.json</text>
  </g>
</svg>
