<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Календарные периоды AML-данных</title>
  <desc id="desc">Периоды режутся по целым дням: warmup — 1 сентября, train — 2–6 сентября, validation — 7 сентября, threshold — 8 сентября, test — 9–10 сентября. Разреженный хвост с 11 сентября исключается. История накапливается слева направо.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fee2e2"/><path d="M0 0 V8" stroke="#fca5a5" stroke-width="3"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="22" fill="#f8fafc"/>
  <g font-family="Arial, DejaVu Sans, sans-serif">
    <text x="40" y="48" font-size="27" font-weight="700" fill="#0f172a">Сначала прошлое, потом будущее</text>
    <text x="40" y="80" font-size="18" fill="#475569">Границы — целые дни, поэтому val и threshold покрывают все часы суток</text>
    <rect x="40" y="112" width="106" height="65" fill="#e2e8f0"/>
    <rect x="146" y="112" width="530" height="65" fill="#dbeafe"/>
    <rect x="676" y="112" width="106" height="65" fill="#ccfbf1"/>
    <rect x="782" y="112" width="106" height="65" fill="#fef3c7"/>
    <rect x="888" y="112" width="212" height="65" fill="#e0e7ff"/>
    <rect x="1100" y="112" width="60" height="65" fill="url(#hatch)"/>
    <text x="93" y="152" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Warmup</text>
    <text x="411" y="152" text-anchor="middle" font-size="23" font-weight="700" fill="#1e40af">Train</text>
    <text x="729" y="152" text-anchor="middle" font-size="18" font-weight="700" fill="#115e59">Val</text>
    <text x="835" y="152" text-anchor="middle" font-size="18" font-weight="700" fill="#854d0e">Threshold</text>
    <text x="994" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#4338ca">Test</text>
    <text x="93" y="202" text-anchor="middle" font-size="16" fill="#475569">1 сен</text>
    <text x="411" y="202" text-anchor="middle" font-size="16" fill="#475569">2–6 сен</text>
    <text x="729" y="202" text-anchor="middle" font-size="16" fill="#475569">7 сен</text>
    <text x="835" y="202" text-anchor="middle" font-size="16" fill="#475569">8 сен</text>
    <text x="994" y="202" text-anchor="middle" font-size="16" fill="#475569">9–10 сен</text>
    <text x="1130" y="202" text-anchor="middle" font-size="16" fill="#b91c1c">хвост</text>
    <text x="93" y="224" text-anchor="middle" font-size="14" fill="#64748b">только история</text>
    <text x="1130" y="224" text-anchor="middle" font-size="14" fill="#b91c1c">исключён</text>
    <path d="M40 262 H1156" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="40" y="299" font-size="18" fill="#334155">История растёт по времени. Метки в неё не входят.</text>
    <text x="40" y="326" font-size="17" fill="#64748b">Даты — для HI-Small; начало test — день, в который попадает 85-й процентиль строк.</text>
  </g>
</svg>
